[custom]

; 1、基本配置覆盖
clash_core = 3
mixed-port = 7893
allow-lan = true
mode = rule
log-level = info
ipv6 = true

; 📱 完美注入手机端 DNS 与 TUN 模块
custom_text = dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: false
  default-nameserver:
    - 114.114.114.114
    - tls://223.5.5.5:853
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - '*.lan'
    - "rule-set:cn_domain"
  \ntun:
  enable: true
  stack: system
  dns-hijack: [0.0.0.0:53]
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false
  endpoint-independent-nat: true

; 💡【核心新增】建立一个名叫“全球直连”的影子策略组，完美解决手机找不到该代理组的报错
custom_proxy_group = 全球直连`select`[]DIRECT

; 2、自定义策略组（域名组-节点组）- 内部可选追加 [全球直连]
custom_proxy_group = 🎬 Emby`select`[]低倍率-自动`[]所有-自动`[]港台日新韩-自动`[]DIRECT`[]全球直连`[]所有-手动`[]REJECT
custom_proxy_group = 🎞️ YouTube`select`[]所有-自动`[]港台日新韩-自动`[]台日新韩-自动`[]香港-自动`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]韩国-自动`[]美国-自动`[]其他-自动`[]所有-手动`[]DIRECT`[]全球直连`[]REJECT
