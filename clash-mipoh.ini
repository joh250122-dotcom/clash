[custom]

; 1、基本配置覆盖
clash_core = 3
mixed-port = 7893
allow-lan = true
mode = rule
log-level = info
ipv6 = true

; 📱 完美注入手机端 DNS 与 TUN 模块
custom_text = dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: false
  default-nameserver:
    - 114.114.114.114
    - tls://223.5.5.5:853
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - '*.lan'
    - "rule-set:cn_domain"
  \ntun:
  enable: true
  stack: system
  dns-hijack: [0.0.0.0:53]
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false
  endpoint-independent-nat: true

; 🎯【核心修复】彻底解决手机报错的核心占位组，名字与报错完全一致！
custom_proxy_group = 🎯 全球直连`select`[]DIRECT
custom_proxy_group = 全球直连`select`[]DIRECT
custom_proxy_group = 一键代理`select`[]香港故转`[]台湾故转`[]日本故转`[]韩国故转`[]新加坡故转`[]美国故转`[]欧洲故转`[]香港自动`[]台湾自动`[]日本自动`[]韩国自动`[]新加坡自动`[]美国自动`[]欧洲自动`[]香港手动`[]台湾手动`[]日本手动`[]韩国手动`[]新加坡手动`[]美国手动`[]欧洲手动`[]其他手动`[]DIRECT`[]REJECT

